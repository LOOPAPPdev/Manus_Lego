# OpenTelemetry Collector for the local/staging stack.
#
# The API and the Python services emit OTLP when OTEL_EXPORTER_OTLP_ENDPOINT is set.
# Without it they log to stdout only — observability is opt-in, not a hidden dependency.
#
#   docker run --rm -p 4317:4317 -p 4318:4318 \
#     -v "$PWD/infrastructure/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml" \
#     otel/opentelemetry-collector-contrib:0.115.1

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bounded memory: a collector that OOMs during an incident is worse than no collector.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch:
    timeout: 5s
    send_batch_size: 512
  # Drop attributes that could carry credentials or tenant identifiers.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: db.statement
        action: delete
      - key: document.text
        action: delete
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  # Local debugging surface; in production replace with your vendor/exporter.
  debug:
    verbosity: normal
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug]
