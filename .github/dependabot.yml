version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      javascript-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(js)"
    labels: [dependencies, javascript]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    labels: [dependencies, ci]

  # The two Python services are independent uv projects, so each needs its own entry.
  - package-ecosystem: uv
    directory: /services/orchestrator
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(orchestrator)"
    labels: [dependencies, python]

  - package-ecosystem: uv
    directory: /services/rag
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(rag)"
    labels: [dependencies, python]

  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(container)"
    labels: [dependencies, containers]
