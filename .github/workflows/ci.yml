name: ci

# Every action is pinned to a commit SHA. A tag is mutable; a SHA is not.
# Permissions are read-only by default; no job here needs to write to the repository.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.20.0"
  PYTHON_VERSION: "3.12"

jobs:
  javascript:
    name: javascript (lint, typecheck, build, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, build, test
        run: pnpm exec turbo run lint typecheck build test --continue

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: js-dist
          path: |
            apps/api/dist
            apps/web/dist
          retention-days: 7
          if-no-files-found: warn

  python:
    name: python (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: orchestrator
            package: lego_orchestrator
          - service: rag
            package: lego_rag
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.7"
          enable-cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install (frozen lockfile)
        run: uv sync --project services/${{ matrix.service }} --frozen

      - name: Lint (ruff, including S security rules)
        run: uv run --project services/${{ matrix.service }} ruff check services/${{ matrix.service }}

      - name: Format check
        run: uv run --project services/${{ matrix.service }} ruff format --check services/${{ matrix.service }}

      - name: Test
        run: uv run --project services/${{ matrix.service }} pytest services/${{ matrix.service }}/tests -q

  catalog:
    name: catalog and specification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Engine self-tests (stdlib only)
        run: python -m unittest discover -s tests -p "test_lego_catalog.py" -v

      - name: Catalog provenance
        run: python scripts/lego_catalog.py validate

  gates:
    name: quality gates (lego verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [javascript, python, catalog]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.7"
          enable-cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build
      - run: uv sync --project services/orchestrator --frozen

      - name: Evaluate gates
        # Exit code 3 means "blocked, waiting for a human approval" (G6). That is not a
        # CI failure; exit code 1 means a control is broken, and must fail the job.
        run: |
          set +e
          uv run --project services/orchestrator lego verify --run-tests --environment ci
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::a quality gate failed"
            exit 1
          fi
          echo "gate exit code: $code (0=pass, 3=blocked awaiting approval)"

      - name: Traceability report
        if: always()
        run: uv run --project services/orchestrator lego report

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence
          path: |
            docs/evidence
            reports/junit
          retention-days: 30
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Quality gates"
            echo
            cat docs/evidence/gates.md || echo "_no gate report produced_"
            echo
            echo "## Requirements"
            echo
            sed -n '1,40p' docs/evidence/traceability.md || echo "_no traceability report produced_"
          } >> "$GITHUB_STEP_SUMMARY"
